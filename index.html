<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caesar Cipher Tool</title>
<style>
  body { font-family: Arial, sans-serif; background:#f0f2f5; display:flex; justify-content:center; padding-top:40px; }
  .box { background:#fff; padding:24px; border-radius:12px; width:340px; box-shadow:0 2px 10px rgba(0,0,0,.1); }
  textarea, input { width:100%; padding:10px; font-size:16px; box-sizing:border-box; margin-top:8px; }
  .row { display:flex; gap:8px; margin-top:12px; }
  button { flex:1; padding:10px; font-size:16px; border:none; border-radius:6px; color:#fff; cursor:pointer; }
  #enc { background:#2e7d32; }
  #dec { background:#1565c0; }
  #out { margin-top:12px; padding:10px; background:#eee; border-radius:6px; min-height:40px; word-wrap:break-word; }
</style>
</head>
<body>
<div class="box">
  <h2>Caesar Cipher Tool</h2>
  <textarea id="text" rows="3" placeholder="Enter your message"></textarea>
  <input type="number" id="key" value="3" min="1" max="25" placeholder="Shift (1-25)">
  <div class="row">
    <button id="enc">Encrypt</button>
    <button id="dec">Decrypt</button>
  </div>
  <div id="out">Result will appear here</div>
</div>
<script>
function shiftText(text, k) {
  return text.replace(/[a-z]/gi, c => {
    const base = c <= "Z" ? 65 : 97;
    return String.fromCharCode(((c.charCodeAt(0) - base + k) % 26 + 26) % 26 + base);
  });
}
function run(sign) {
  const text = document.getElementById("text").value;
  const k = parseInt(document.getElementById("key").value) || 0;
  document.getElementById("out").textContent = shiftText(text, sign * k);
}
document.getElementById("enc").onclick = () => run(1);
document.getElementById("dec").onclick = () => run(-1);
</script>
</body>
</html>
